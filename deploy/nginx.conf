# BDK production nginx (templated by the official image: ${SERVER_NAME}).
# Every path is served by the backend — the server-rendered app, /api, the
# admin panel, auth pages, and static assets all live there.

server {
    listen 80;
    server_name ${SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ${SERVER_NAME};

    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 500M;
    gzip on;
    gzip_types text/css application/javascript application/json application/vnd.mapbox-vector-tile;

    # Maintenance mode: `touch /srv/bdk/maintenance/on` on the host 503s every
    # new request instantly (the -f is checked per request — no reload);
    # `rm -f` restores. In-flight requests are unaffected. Used to quiesce the
    # site before a deploy so no new work reaches the backend or the worker.
    location / {
        if (-f /maintenance/on) {
            return 503;
        }
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;          # SSE (job pill / map finalize streams)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    error_page 503 @maintenance;
    location @maintenance {
        default_type text/plain;
        add_header Retry-After 300 always;
        return 503 "BDK is down for maintenance and will be back shortly.";
    }
}
