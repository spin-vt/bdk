# BDK production — WEB host: nginx (TLS) + the backend under gunicorn.
# The backend image is pulled from ghcr, tagged by commit SHA (${TAG}, set by
# deploy.sh — never built on the host). Real config in ./\.env (from
# ../env.example), chmod 600.
#
#   TAG=<sha> docker compose --env-file .env up -d   (deploy.sh wraps this)

services:
  backend:
    image: ghcr.io/spin-vt/backend:${TAG}
    command: gunicorn routes:app -b 0.0.0.0:8000 -w 4 --threads 8 --timeout 120 --log-level info
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_TOKEN_LOCATION=${JWT_TOKEN_LOCATION}
      - JWT_ACCESS_COOKIE_NAME=${JWT_ACCESS_COOKIE_NAME}
      - IN_PRODUCTION=${IN_PRODUCTION}
      - SERVER_NAME=${SERVER_NAME}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - MAIL_SERVER=${MAIL_SERVER}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USE_TLS=${MAIL_USE_TLS}
      - MAIL_USE_SSL=${MAIL_USE_SSL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - DEVELOP_BACKEND_PORT=${DEVELOP_BACKEND_PORT}
      - MAPTILE_STREET=${MAPTILE_STREET}
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    volumes:
      - ../nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${SSL_CERT_PATH}:/etc/nginx/ssl/server.crt:ro
      - ${SSL_KEY_PATH}:/etc/nginx/ssl/server.key:ro
      # Maintenance flag dir — OUTSIDE the checkout on purpose: deploy.sh
      # refuses a dirty tree, and an untracked flag file would count as dirty.
      # `touch /srv/bdk/maintenance/on` = down for maintenance; `rm -f` = up.
      - /srv/bdk/maintenance:/maintenance:ro
    environment:
      - SERVER_NAME=${SERVER_NAME}
