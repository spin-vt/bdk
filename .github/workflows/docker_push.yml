name: Build and push images

# Build the backend and worker images and push them to ghcr, tagged by commit
# SHA, on every green main build (and on demand). Deploys then PULL a tagged
# image — production never builds on the host. Building an image for a commit
# that is never deployed is cheap and harmless.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Only build images for commits that passed CI.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: backend
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          file: ./back-end/Dockerfile.backend
          push: true
          tags: |
            ghcr.io/spin-vt/backend:${{ env.SHA }}
            ghcr.io/spin-vt/backend:latest

      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: ./back-end
          file: ./back-end/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/spin-vt/worker:${{ env.SHA }}
            ghcr.io/spin-vt/worker:latest
