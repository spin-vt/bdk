name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lint + format check (no DB needed). Runs in the same image the tests use.
      - name: ruff
        run: >
          docker compose -f docker-compose.test.yml run --rm --no-deps test
          sh -c "uv sync --frozen && uv run ruff check . && uv run ruff format --check ."

      # Full committable suite in Docker against a throwaway Postgres.
      # The `golden` tests need local prod data and are deselected automatically
      # by the test service's command.
      - name: pytest
        run: docker compose -f docker-compose.test.yml run --rm test

  frontend:
    name: frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - name: install
        run: npm ci
      # Jest + React Testing Library component/contract tests (jsdom, no browser).
      - name: jest
        run: npm test -- --ci
