[project]
name = "bdk-backend"
version = "0.1.0"
description = "BDK (Broadband Data Kit) backend — Flask API + Celery workers for FCC BDC filings"
requires-python = ">=3.12"

# Only DIRECT dependencies are listed; uv resolves the rest into uv.lock.
# Several packages from the old requirements.txt were dropped because nothing
# imports them: Flask-Login, Flask-SQLAlchemy (raw SQLAlchemy is used), folium,
# branca, matplotlib, scikit-learn, scipy, networkx, mapclassify, response.
dependencies = [
    # Web framework + auth
    "Flask>=3.0",
    "Flask-Cors>=4.0",
    "Flask-JWT-Extended>=4.6",
    "Flask-Mail>=0.10",
    "gunicorn>=22.0",
    "PyJWT>=2.8",
    # Database
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    # Async tasks
    "celery[redis]>=5.4",
    # Data — cap pandas to the mature 2.x line (pandas 3.0 is too new for the
    # geo stack to be validated against, and changes string/copy-on-write semantics).
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    # Geospatial
    "geopandas>=1.0",
    "shapely>=2.0.4",
    "pyproj>=3.6",
    "fiona>=1.10",
    "pyogrio>=0.9",
    "Rtree>=1.3",
    "fastkml>=1.0",
    # Misc
    "Pillow>=10.3",
    "shortuuid>=1.0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
# This is an application, not an installable library — don't try to build/install it.
package = false

# ---------------------------------------------------------------------------
# Ruff (lint + format). Intentionally lenient to start; tighten over time.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
# Generated/vendored dirs to skip.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line length handled by the formatter; don't fail lint on it
    "B008",  # function calls in argument defaults (common in Flask/SQLAlchemy)
    "E722",  # bare except — present throughout; clean up in the refactor phase
    # The rules below flag REAL smells/bugs in the legacy code, not mechanical
    # nits. Deferred to the Phase 1 refactor so they get fixed carefully (with
    # tests) rather than auto-mangled. See docs/STATUS.md "Watch-outs".
    "F841",  # unused local variable (×11)
    "B905",  # zip() without strict= (×6)
    "B012",  # return/break in finally swallows exceptions — get_kml_data (×1)
    "F402",  # import shadowed by loop var (×1)
    "F823",  # local used before assignment — potential bug (×1)
    "W291",  # trailing whitespace inside multiline strings (×5)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: NBM golden-data comparison; needs real data and may fail on first run",
    "realdata: requires uncommittable real ISP data under dev-data/real-do-not-commit",
    "tippecanoe: requires the tippecanoe binary on PATH",
]
