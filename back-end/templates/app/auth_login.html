{% extends "app/auth_base.html" %}
{% block title %}Sign in · BDK{% endblock %}
{% block heading %}Sign in{% endblock %}
{% block card %}
{% if error %}<div style="color:var(--bad);font-size:13px">{{ error }}</div>{% endif %}
<form method="post" style="display:flex;flex-direction:column;gap:10px">
  <div class="fld"><label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" autofocus></div>
  <div class="fld"><label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password"></div>
  <button class="btn primary" type="submit">Sign in</button>
</form>
<div style="display:flex;justify-content:space-between;font-size:12.5px">
  <a href="/auth/reset">Forgot password?</a>
  <a href="/auth/register">Create an account</a>
</div>
{% endblock %}
